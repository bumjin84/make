      <button class="tab-btn active" id="tab-editor">에디터 (Markdown)</button>
      <button class="tab-btn" id="tab-preview">미리보기 (Preview)</button>
    </div>

    <main class="workspace">
      <!-- 에디터 영역 -->
      <div class="pane editor-pane" id="pane-editor">
        <textarea id="editor" placeholder="여기에 마크다운을 입력하세요..."># 📝 Markdown Studio (Theme & Export Lab)

상단 메뉴에서 **다양한 테마(GitHub, Notion, Academic)**를 실시간으로 변경해 보세요!
작성한 문서는 원본 `.md` 파일이나 테마 스타일이 내장된 `.html` 파일로 즉시 다운로드할 수 있습니다.

---

## 🎨 주요 기능
1. **4가지 프리미엄 테마**: GitHub Dark, GitHub Light, Notion Clean, Academic Sepia
2. **독립 실행형 HTML 내보내기**: 테마 CSS가 인라인 내장되어 외부 인터넷 없이도 언제 어디서나 동일하게 열람 가능
3. **모바일 적응형 뷰포트**: 좁은 화면에서는 상단 탭으로 에디터와 미리보기를 1초 만에 전환

### 코드 블록 테스트
```javascript
// Vite Monorepo Markdown Studio
function exportStandaloneHTML(theme, content) {
  return `<!DOCTYPE html><html>...<style>/* ${theme} */</style><body>${content}</body></html>`;
}
console.log("Export ready!");
```

### 테이블 테스트
| 기능 | 지원 여부 | 설명 |
| :--- | :---: | :--- |
| **.md 다운로드** | ✅ 지원 | 원본 마크다운 파일 저장 |
| **.html 다운로드** | ✅ 지원 | 테마 CSS 인라인 내장형 HTML |
| **HTML 클립보드 복사**| ✅ 지원 | 블로그 및 노션 붙여넣기용 |

> "좋은 도구는 생각을 방해하지 않고 흐름을 이어준다."
